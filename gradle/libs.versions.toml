## AgroVisión — catálogo de versiones (§17.5: versiones fijadas en el repositorio)

[versions]
# ── SDK ──
compileSdk = "35"
targetSdk = "35"
# ⚠️ INVARIANTE PLAY STORE — ver ADR-012 y PRESERVE.md §3.
#
# La app publicada declara minSdkVersion 22 (Android 5.1). El documento de
# arquitectura pide 26, pero §2.1 prohíbe subir el minSdk publicado sin análisis
# de impacto, y subir 22 → 26 deja sin actualizaciones a todo dispositivo con
# Android 5.1, 6, 7 y 7.1 que hoy tiene la app instalada — sin aviso y sin que
# el usuario pueda hacer nada.
#
# Ese es exactamente el hardware del público objetivo. Se mantiene 22 y se
# degrada por capacidad en tiempo de ejecución: NNAPI requiere API 27, así que
# por debajo se cae a CPU con cuatro hilos, que es el respaldo que el propio
# documento ya contempla (§7.3).
minSdk = "22"

# ── Cadena de herramientas ──
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
javaVersion = "17"

# ── AndroidX ──
androidxCore = "1.15.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxNavigation = "2.8.5"
androidxComposeBom = "2024.12.01"
androidxRoom = "2.6.1"
androidxDatastore = "1.1.1"
androidxWork = "2.10.0"
androidxCamera = "1.4.1"
androidxExifinterface = "1.3.7"
androidxSecurityCrypto = "1.1.0-alpha06"
androidxProfileinstaller = "1.4.1"
androidxSplashscreen = "1.0.1"
androidxHiltWork = "1.2.0"
# Obligatorio con minSdk 22: aporta java.time y las APIs de java.util.stream que
# Room y kotlinx dan por hechas a partir de API 26.
desugarJdkLibs = "2.1.4"

# ── Kotlin ──
coroutines = "1.9.0"
kotlinxSerialization = "1.7.3"
kotlinxDatetime = "0.6.1"

# ── Inyección ──
hilt = "2.53.1"

# ── Red ──
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofitKotlinxSerialization = "1.0.0"

# ── Inferencia ──
# LiteRT es el nombre actual del runtime antes llamado TensorFlow Lite. Las
# clases siguen en el paquete org.tensorflow.lite, por lo que el código no
# cambia si hubiera que volver a las coordenadas antiguas (ver README §Runtime).
litert = "1.0.1"

# ── Criptografía ──
# Ed25519 vía java.security.Signature solo está disponible desde API 33.
# minSdk es 26, así que la verificación de firma usa la implementación
# autónoma de BouncyCastle, idéntica en todas las versiones de Android.
bouncycastle = "1.78.1"

# ── Servicios Google ──
playIntegrity = "1.4.0"
playServicesLocation = "21.3.0"
firebaseBom = "33.7.0"
googleServices = "4.4.2"

# ── Pruebas ──
junit5 = "5.11.3"
androidJunit5Plugin = "1.11.2.0"
junit4 = "4.13.2"
turbine = "1.2.0"
mockk = "1.13.13"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"
androidxTestRules = "1.6.1"
robolectric = "4.14.1"

[libraries]

# ── AndroidX base ──
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifinterface" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidxSecurityCrypto" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# ── Ciclo de vida ──
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }

# ── Compose ──
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# ── Room ──
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "androidxRoom" }

# ── DataStore ──
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore", version.ref = "androidxDatastore" }

# ── WorkManager ──
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "androidxWork" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHiltWork" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# ── CameraX ──
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "androidxCamera" }

# ── Kotlin ──
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# ── Inyección ──
# javax.inject en los módulos Kotlin puros: son anotaciones sin dependencia de
# Android ni de Dagger. Permiten que el dominio se deje inyectar sin conocer Hilt.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# ── Red ──
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# ── Inferencia (solo módulos :ml) ──
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }

# ── Criptografía ──
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# ── Servicios Google ──
play-integrity = { group = "com.google.android.gms", name = "play-services-tasks", version = "18.2.0" }
play-integrity-api = { group = "com.google.android.play", name = "integrity", version.ref = "playIntegrity" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# ── Pruebas ──
junit5-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit5-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit5" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
# ⚠️ OBLIGATORIO. Sin el motor vintage, la plataforma JUnit5 IGNORA EN SILENCIO
# toda clase JUnit4 —las de Robolectric, entre ellas— y el build sale verde
# habiendo ejecutado cero de esas pruebas. Un build verde que miente es peor que
# uno rojo.
junit5-vintage = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit5" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

# ── Artefactos de los plugins de convención (build-logic) ──
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompilerGradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
